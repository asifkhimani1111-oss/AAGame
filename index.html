<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A&AGame - Bottle Colour</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Top Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .btn {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
      transition: transform 0.15s, background 0.2s, opacity 0.2s;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn:disabled {
      background: #334155;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.65;
    }

    .btn-secondary {
      background: #3b82f6;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.35);
    }

    .btn-success {
      background: #10b981;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.45);
      animation: pulseBtn 1.5s infinite;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Sub Controls & Stats */
    .sub-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
    }

    .game-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 4px 0 10px;
    }

    .badge {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #f8fafc;
    }

    /* Game Arena */
    .arena {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 20px 10px;
      min-height: 360px;
    }

    .bottles-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 18px 16px;
      max-width: 480px;
      width: 100%;
      position: relative;
    }

    .bottle-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1;
    }

    .bottle-wrapper.selected {
      transform: translateY(-22px);
      z-index: 10;
    }

    .bottle-wrapper.pouring {
      z-index: 50;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Bottle Design */
    .bottle {
      width: 62px;
      height: 175px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bottle-cap {
      width: 30px;
      height: 10px;
      background: linear-gradient(90deg, #d97706, #fbbf24, #d97706);
      border-radius: 4px 4px 1px 1px;
      position: absolute;
      top: -8px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    .bottle.completed .bottle-cap {
      opacity: 1;
      transform: translateY(0);
    }

    .bottle-neck {
      width: 26px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, 0.75);
      border-bottom: none;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .bottle-neck::before {
      content: '';
      position: absolute;
      top: -3px;
      left: -4px;
      right: -4px;
      height: 5px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
    }

    .bottle-body {
      width: 60px;
      height: 142px;
      border: 2.5px solid rgba(255, 255, 255, 0.75);
      border-radius: 14px 14px 20px 20px;
      background: linear-gradient(90deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.08) 100%);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.1), 0 8px 18px rgba(0, 0, 0, 0.35);
      padding: 5px;
      display: flex;
      flex-direction: column-reverse;
      justify-content: flex-start;
      gap: 3px;
      overflow: hidden;
      position: relative;
    }

    /* Glass reflection line */
    .bottle-body::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 7px;
      width: 4px;
      height: 115px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      pointer-events: none;
    }

    .layer {
      width: 100%;
      height: 29px;
      border-radius: 7px;
      transition: all 0.25s ease;
      box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.25), inset 0 2px 4px rgba(255, 255, 255, 0.35);
    }

    .layer:first-child {
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }

    .bottle-num {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Pouring Stream Line */
    #pour-stream {
      position: fixed;
      width: 6px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 45;
      display: none;
      transition: height 0.15s ease;
    }

    /* Bottom Action Buttons */
    .bottom-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 14px 12px;
      flex-wrap: wrap;
    }

    /* Win Banner */
    .win-banner {
      text-align: center;
      color: #34d399;
      font-weight: 700;
      font-size: 1.15rem;
      min-height: 28px;
      margin-bottom: 4px;
      text-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    /* ============================================================
       AD MONETIZATION SLOT (Ready for AdMob / AdSense / Android)
       ============================================================ */
    .ad-banner-container {
      width: 100%;
      min-height: 54px;
      background: #0b1120;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-bar">
    <div class="brand">🎮 A&AGame</div>
    <button class="btn" onclick="goHome()">🏠 Home</button>
  </div>

  <!-- Sub Header -->
  <div class="sub-bar">
    <button class="btn btn-secondary" onclick="prevLevel()">← પાછા</button>
    <div class="game-title">🧪 Bottle Colour</div>
    <button class="btn btn-secondary" id="soundBtn" onclick="toggleSound()">🔊 Sound ON</button>
  </div>

  <!-- Level & Moves Info -->
  <div class="stats-row">
    <div class="badge" id="levelDisplay">Level: 1</div>
    <div class="badge" id="movesDisplay">Moves: 0</div>
  </div>

  <div class="win-banner" id="winBanner"></div>

  <!-- Main Game Area -->
  <div class="arena">
    <div class="bottles-grid" id="bottlesGrid"></div>
  </div>

  <!-- Pouring Visual Stream -->
  <div id="pour-stream"></div>

  <!-- Action Controls -->
  <div class="bottom-controls">
    <button class="btn btn-secondary" onclick="restartLevel()">🔄 Restart</button>
    <button class="btn btn-secondary" id="undoBtn" onclick="undoMove()" disabled>↩ Undo</button>
    <button class="btn btn-secondary" onclick="addExtraBottle()" id="extraBottleBtn">➕ +1 બોટલ (Ad)</button>
    <button class="btn" id="nextBtn" onclick="nextLevel()" disabled>આગળ →</button>
  </div>

  <!-- Bottom Banner Ad Placeholder (For Android WebView / AdMob) -->
  <div class="ad-banner-container" id="adBannerSlot">
    <!-- અહીં ભવિષ્યમાં AdMob Banner અથવા AdSense કોડ લાગશે -->
    <span>A&AGame • Ad Space (320x50)</span>
  </div>

  <script>
    /* ============================================================
       1. AD MONETIZATION BRIDGE (Android / AdMob Ready - 100% Free)
       ============================================================ */
    const AdManager = {
      levelsCompletedSinceAd: 0,

      // દર 3 લેવલ પૂર્ણ થાય ત્યારે Interstitial Ad બતાવવા માટેનો હુક
      onLevelComplete: function(levelNum) {
        this.levelsCompletedSinceAd++;
        if (this.levelsCompletedSinceAd >= 3) {
          this.levelsCompletedSinceAd = 0;
          this.showInterstitialAd();
        }
      },

      showInterstitialAd: function() {
        // જો Android WebView (Kodular / MIT App Inventor / Android Studio) માં AdMob જોડેલ હોય તો:
        if (window.AndroidAds && typeof window.AndroidAds.showInterstitial === 'function') {
          window.AndroidAds.showInterstitial();
        } else {
          console.log("[AdManager] Interstitial Ad Triggered (Ready for Android AdMob)");
        }
      },

      // રિવોર્ડેડ એડ (ખેલાડીને +1 ખાલી બોટલ આપવા માટે)
      showRewardedAd: function(onRewardEarned) {
        if (window.AndroidAds && typeof window.AndroidAds.showRewarded === 'function') {
          window.AndroidAds.showRewarded();
          onRewardEarned();
        } else {
          // વેબ પર અત્યારે સીધું જ રિવોર્ડ કામ કરશે
          onRewardEarned();
        }
      }
    };

    /* ============================================================
       2. OFFLINE SOUND ENGINE (Web Audio API - No External Files)
       ============================================================ */
    let soundEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      } catch (e) {}
    }

    function playSelectSound() { playTone(520, 'sine', 0.1); }
    function playPourSound() {
      playTone(340, 'triangle', 0.15, 0);
      playTone(420, 'triangle', 0.15, 0.08);
      playTone(500, 'triangle', 0.18, 0.16);
    }
    function playErrorSound() { playTone(180, 'sawtooth', 0.18); }
    function playWinSound() {
      playTone(523.25, 'sine', 0.18, 0);
      playTone(659.25, 'sine', 0.18, 0.12);
      playTone(783.99, 'sine', 0.18, 0.24);
      playTone(1046.50, 'sine', 0.35, 0.36);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').innerText = soundEnabled ? '🔊 Sound ON' : '🔇 Sound OFF';
    }

    /* ============================================================
       3. GAME CONFIGURATION & PROCEDURAL LEVEL GENERATOR
       ============================================================ */
    const CAPACITY = 4; // દરેક બોટલમાં બરાબર 4 લેયર

    const PALETTE = [
      { id: 'red',    bg: 'linear-gradient(180deg, #ff5252, #d50000)' },
      { id: 'blue',   bg: 'linear-gradient(180deg, #38bdf8, #0284c7)' },
      { id: 'green',  bg: 'linear-gradient(180deg, #4ade80, #16a34a)' },
      { id: 'yellow', bg: 'linear-gradient(180deg, #facc15, #ca8a04)' },
      { id: 'purple', bg: 'linear-gradient(180deg, #c084fc, #7e22ce)' },
      { id: 'orange', bg: 'linear-gradient(180deg, #fb923c, #ea580c)' },
      { id: 'pink',   bg: 'linear-gradient(180deg, #f472b6, #db2777)' },
      { id: 'teal',   bg: 'linear-gradient(180deg, #2dd4bf, #0f766e)' }
    ];

    let currentLevel = parseInt(localStorage.getItem('aa_bottle_level')) || 1;
    let bottles = [];
    let initialBottles = [];
    let history = [];
    let moves = 0;
    let selectedBottle = null;
    let isAnimating = false;
    let extraBottleUsed = false;

    // Seeded Random જેથી દરેક લેવલ હંમેશા એકસરખું અને સોલ્વ થઈ શકે તેવું બને
    function seededRandom(seed) {
      let x = Math.sin(seed * 9999) * 10000;
      return x - Math.floor(x);
    }

    function generateLevelData(level) {
      // Level 1: 2 રંગ + 1 ખાલી બોટલ (સરળ શરૂઆત)
      if (level === 1) {
        return [
          ['red', 'blue', 'red', 'blue'],
          ['blue', 'red', 'blue', 'red'],
          []
        ];
      }

      // Level 2: 3 રંગ + 2 ખાલી બોટલ
      if (level === 2) {
        return [
          ['red', 'green', 'blue', 'red'],
          ['blue', 'red', 'green', 'blue'],
          ['green', 'blue', 'red', 'green'],
          [],
          []
        ];
      }

      // Level 3 થી અનંત લેવલ સુધી આપમેળે જનરેટ થશે
      const numColors = Math.min(2 + Math.floor((level + 1) / 2), PALETTE.length);
      const emptyBottles = 2;
      let pool = [];

      for (let c = 0; c < numColors; c++) {
        for (let k = 0; k < CAPACITY; k++) {
          pool.push(PALETTE[c].id);
        }
      }

      // Shuffle pool using level seed
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(seededRandom(level * 100 + i) * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      let result = [];
      for (let b = 0; b < numColors; b++) {
        result.push(pool.slice(b * CAPACITY, (b + 1) * CAPACITY));
      }
      for (let e = 0; e < emptyBottles; e++) {
        result.push([]);
      }

      // જો ભૂલથી પહેલેથી જ સોલ્વ થઈ ગયું હોય તો ફરી મિક્સ કરો
      if (result.every(b => isBottleComplete(b) || b.length === 0)) {
        [result[0][0], result[1][0]] = [result[1][0], result[0][0]];
      }

      return result;
    }

    function cloneState(state) {
      return state.map(b => [...b]);
    }

    function loadLevel(level) {
      currentLevel = Math.max(1, level);
      localStorage.setItem('aa_bottle_level', currentLevel);

      initialBottles = generateLevelData(currentLevel);
      bottles = cloneState(initialBottles);
      history = [];
      moves = 0;
      selectedBottle = null;
      isAnimating = false;
      extraBottleUsed = false;

      document.getElementById('levelDisplay').innerText = `Level: ${currentLevel}`;
      document.getElementById('movesDisplay').innerText = `Moves: 0`;
      document.getElementById('winBanner').innerText = '';
      document.getElementById('extraBottleBtn').disabled = false;

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = true;
      nextBtn.className = 'btn';

      updateUndoBtn();
      renderBottles();
    }

    /* ============================================================
       4. RENDERING & ANIMATION LOGIC
       ============================================================ */
    function getColorBg(colorId) {
      const found = PALETTE.find(c => c.id === colorId);
      return found ? found.bg : '#ffffff';
    }

    function isBottleComplete(bottle) {
      if (bottle.length !== CAPACITY) return false;
      return bottle.every(c => c === bottle[0]);
    }

    function checkWin() {
      return bottles.every(b => b.length === 0 || isBottleComplete(b));
    }

    function renderBottles() {
      const grid = document.getElementById('bottlesGrid');
      grid.innerHTML = '';

      bottles.forEach((bottle, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'bottle-wrapper' + (selectedBottle === index ? ' selected' : '');
        wrapper.id = `bottle-wrap-${index}`;

        const complete = isBottleComplete(bottle);
        const bottleDiv = document.createElement('div');
        bottleDiv.className = 'bottle' + (complete ? ' completed' : '');
        bottleDiv.onclick = () => onBottleClick(index);

        const cap = document.createElement('div');
        cap.className = 'bottle-cap';

        const neck = document.createElement('div');
        neck.className = 'bottle-neck';

        const body = document.createElement('div');
        body.className = 'bottle-body';

        bottle.forEach(colorId => {
          const layer = document.createElement('div');
          layer.className = 'layer';
          layer.style.background = getColorBg(colorId);
          body.appendChild(layer);
        });

        const num = document.createElement('div');
        num.className = 'bottle-num';
        num.innerText = index + 1;

        bottleDiv.appendChild(cap);
        bottleDiv.appendChild(neck);
        bottleDiv.appendChild(body);
        wrapper.appendChild(bottleDiv);
        wrapper.appendChild(num);
        grid.appendChild(wrapper);
      });
    }

    function canPour(fromIdx, toIdx) {
      if (fromIdx === toIdx) return false;
      const src = bottles[fromIdx];
      const dst = bottles[toIdx];

      if (src.length === 0) return false;
      if (dst.length >= CAPACITY) return false;
      if (dst.length === 0) return true;

      return src[src.length - 1] === dst[dst.length - 1];
    }

    function onBottleClick(index) {
      if (isAnimating || checkWin()) return;

      // 1. જો કોઈ બોટલ સિલેક્ટ ન હોય
      if (selectedBottle === null) {
        if (bottles[index].length === 0 || isBottleComplete(bottles[index])) {
          playErrorSound();
          return;
        }
        selectedBottle = index;
        playSelectSound();
        renderBottles();
        return;
      }

      // 2. એ જ બોટલ પર ફરી ક્લિક થાય તો અનસિલેક્ટ કરો
      if (selectedBottle === index) {
        selectedBottle = null;
        playSelectSound();
        renderBottles();
        return;
      }

      // 3. બીજી બોટલમાં રેડવાનો પ્રયાસ
      if (canPour(selectedBottle, index)) {
        executePourWithAnimation(selectedBottle, index);
      } else {
        // જો બીજી બોટલ પર ક્લિક કર્યું અને તેમાં રેડી ન શકાય, તો તેને જ સિલેક્ટ કરો
        if (bottles[index].length > 0 && !isBottleComplete(bottles[index])) {
          selectedBottle = index;
          playSelectSound();
        } else {
          selectedBottle = null;
          playErrorSound();
        }
        renderBottles();
      }
    }

    function executePourWithAnimation(fromIdx, toIdx) {
      isAnimating = true;
      const srcWrap = document.getElementById(`bottle-wrap-${fromIdx}`);
      const dstWrap = document.getElementById(`bottle-wrap-${toIdx}`);
      const stream = document.getElementById('pour-stream');

      const srcRect = srcWrap.getBoundingClientRect();
      const dstRect = dstWrap.getBoundingClientRect();

      // ટાર્ગેટ બોટલ ડાબે છે કે જમણે તે મુજબ નમવાની દિશા નક્કી કરો
      const pourRight = dstRect.left >= srcRect.left;
      const targetX = dstRect.left + (pourRight ? -38 : 38);
      const targetY = dstRect.top - 55;

      const deltaX = targetX - srcRect.left;
      const deltaY = targetY - srcRect.top;
      const angle = pourRight ? 62 : -62;

      srcWrap.classList.remove('selected');
      srcWrap.classList.add('pouring');
      srcWrap.style.transform = `translate(${deltaX}px, ${deltaY}px) rotate(${angle}deg)`;

      const movingColor = bottles[fromIdx][bottles[fromIdx].length - 1];
      playPourSound();

      // રંગની ધાર (Stream) બતાવો
      setTimeout(() => {
        stream.style.display = 'block';
        stream.style.background = getColorBg(movingColor);
        stream.style.left = `${dstRect.left + dstRect.width / 2 - 3}px`;
        stream.style.top = `${dstRect.top - 18}px`;
        stream.style.height = `125px`;
      }, 220);

      // ડેટા અપડેટ કરો અને બોટલ પાછી જગ્યાએ મૂકો
      setTimeout(() => {
        stream.style.display = 'none';

        history.push({
          bottles: cloneState(bottles),
          moves: moves
        });

        const src = bottles[fromIdx];
        const dst = bottles[toIdx];
        const colorToMove = src[src.length - 1];

        while (
          src.length > 0 &&
          src[src.length - 1] === colorToMove &&
          dst.length < CAPACITY
        ) {
          dst.push(src.pop());
        }

        moves++;
        selectedBottle = null;
        isAnimating = false;

        document.getElementById('movesDisplay').innerText = `Moves: ${moves}`;
        updateUndoBtn();
        renderBottles();

        // જીતવાની ચકાસણી
        if (checkWin()) {
          playWinSound();
          document.getElementById('winBanner').innerText = `🎉 Level ${currentLevel} પૂર્ણ થયું!`;
          const nextBtn = document.getElementById('nextBtn');
          nextBtn.disabled = false;
          nextBtn.className = 'btn btn-success';
          AdManager.onLevelComplete(currentLevel);
        }
      }, 550);
    }

    /* ============================================================
       5. BUTTON HANDLERS
       ============================================================ */
    function updateUndoBtn() {
      document.getElementById('undoBtn').disabled = history.length === 0;
    }

    function undoMove() {
      if (isAnimating || history.length === 0 || checkWin()) return;
      const lastState = history.pop();
      bottles = lastState.bottles;
      moves = lastState.moves;
      selectedBottle = null;
      document.getElementById('movesDisplay').innerText = `Moves: ${moves}`;
      updateUndoBtn();
      renderBottles();
    }

    function restartLevel() {
      if (isAnimating) return;
      loadLevel(currentLevel);
    }

    function nextLevel() {
      if (isAnimating) return;
      loadLevel(currentLevel + 1);
    }

    function prevLevel() {
      if (isAnimating || currentLevel <= 1) return;
      loadLevel(currentLevel - 1);
    }

    function addExtraBottle() {
      if (isAnimating || extraBottleUsed || checkWin()) return;
      AdManager.showRewardedAd(() => {
        extraBottleUsed = true;
        bottles.push([]);
        document.getElementById('extraBottleBtn').disabled = true;
        playSelectSound();
        renderBottles();
      });
    }

    function goHome() {
      // જો તમારી મુખ્ય ગેમનું હોમ પેજ index.html હોય તો અહીં લિંક સેટ કરી શકો છો:
      if (document.referrer && document.referrer.includes('github.io')) {
        window.history.back();
      } else {
        loadLevel(1);
      }
    }

    // ગેમ શરૂ કરો
    loadLevel(currentLevel);
  </script>
</body>
</html>
