<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A&A UNIVERSAL GAME</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #070b14 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Header */
    .header {
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #38bdf8, #34d399, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .wallet-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .coin-pill {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fde047;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .net-pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .net-online {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .net-offline {
      background: rgba(239, 68, 68, 0.18);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    /* Reward & Boost Strip */
    .reward-strip {
      display: flex;
      gap: 10px;
      padding: 12px 16px 4px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .reward-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      transition: transform 0.15s;
    }

    .reward-btn:active {
      transform: scale(0.95);
    }

    .reward-btn.secondary-boost {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 22px;
      padding: 4px 12px;
      font-weight: 600;
    }

    /* 8 Games Grid */
    .games-container {
      flex: 1;
      padding: 10px 14px 18px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }

    .section-heading {
      font-size: 1rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 540px) {
      .games-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .game-card {
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.16s, border-color 0.2s, background 0.2s;
      position: relative;
    }

    .game-card:active {
      transform: scale(0.96);
    }

    .game-card:hover {
      border-color: rgba(56, 189, 248, 0.6);
      background: rgba(30, 41, 59, 0.98);
    }

    .game-icon {
      font-size: 2rem;
      line-height: 1.1;
    }

    .game-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .game-tag {
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .play-pill {
      margin-top: 4px;
      background: linear-gradient(135deg, #4f46e5, #0ea5e9);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    /* AdMob Banner Slot */
    .ad-banner {
      width: 100%;
      min-height: 52px;
      background: #05080f;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <div class="app-title">🎮 A&A UNIVERSAL GAME</div>
    <div class="wallet-bar">
      <div class="coin-pill" id="coinDisplay">🪙 0 Coins</div>
      <div class="net-pill net-online" id="netStatus">● Online</div>
    </div>
  </div>

  <!-- Rewarded Ads & Boost Actions -->
  <div class="reward-strip">
    <button class="reward-btn" onclick="claimDailyBonus()">🎁 Daily Bonus (Ad)</button>
    <button class="reward-btn secondary-boost" onclick="activate2XBoost()">⚡ 2X Coins Boost (Ad)</button>
  </div>

  <div class="status-msg" id="statusMsg">તમારી પસંદગીની ગેમ પસંદ કરીને રમો!</div>

  <!-- 8 Games Grid -->
  <div class="games-container">
    <div class="section-heading">
      <span>૮ ગેમ્સ (100% Free)</span>
      <span id="boostBadge" style="color:#34d399; font-size:0.8rem;"></span>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <!-- AdMob Banner Placeholder -->
  <div class="ad-banner" id="menuAdBanner">
    <span>A&A UNIVERSAL GAME • Banner Ad Slot (AdMob Ready)</span>
  </div>

  <script>
    /* ============================================================
       1. FREE MONETIZATION & AD HOOKS (NO AUTO-PAY / NO API KEY)
       ============================================================ */
    const FREE_AD_CONFIG = {
      dailyBonusCoins: 100,
      boostDurationMs: 15 * 60 * 1000, // 15 મિનિટ 2X Coins
      interstitialAfterLevels: 3
    };

    let coins = parseInt(localStorage.getItem('aa_coins')) || 0;
    let boostUntil = parseInt(localStorage.getItem('aa_2x_until')) || 0;

    function updateCoinsUI() {
      document.getElementById('coinDisplay').innerText = `🪙 ${coins} Coins`;
      const active2X = Date.now() < boostUntil;
      document.getElementById('boostBadge').innerText = active2X ? '⚡ 2X ACTIVE' : '';
    }

    function addCoins(amount) {
      const mult = (Date.now() < boostUntil) ? 2 : 1;
      coins += amount * mult;
      localStorage.setItem('aa_coins', coins);
      updateCoinsUI();
    }

    function isOnline() {
      return navigator.onLine;
    }

    function updateNetworkUI() {
      const el = document.getElementById('netStatus');
      if (isOnline()) {
        el.className = 'net-pill net-online';
        el.innerText = '● Online';
      } else {
        el.className = 'net-pill net-offline';
        el.innerText = '● Offline';
      }
    }

    window.addEventListener('online', updateNetworkUI);
    window.addEventListener('offline', updateNetworkUI);

    function showRewardedAdFlow(onSuccess) {
      // ઇનામ/બોનસ માટે ઇન્ટરનેટ ચેક
      if (!isOnline()) {
        document.getElementById('statusMsg').innerText =
          '⚠️ Bonus / Reward માટે ઇન્ટરનેટ ચાલુ રાખો (Practice Offline ચાલશે).';
        return;
      }

      // જો ભવિષ્યમાં Android WebView માં AdMob Rewarded Ad જોડાયેલ હોય:
      if (window.AndroidAds && typeof window.AndroidAds.showRewarded === 'function') {
        window.AndroidAds.showRewarded();
        onSuccess();
      } else {
        // અત્યારે વેબ ટેસ્ટિંગમાં સીધું ઇનામ મળશે (કોઈ પેમેન્ટ કે API Key વગર)
        onSuccess();
      }
    }

    function claimDailyBonus() {
      const today = new Date().toISOString().slice(0, 10);
      const lastClaim = localStorage.getItem('aa_last_bonus_day');
      if (lastClaim === today) {
        document.getElementById('statusMsg').innerText = '✅ આજનું Daily Bonus પહેલેથી મળી ગયું છે!';
        return;
      }

      showRewardedAdFlow(() => {
        localStorage.setItem('aa_last_bonus_day', today);
        addCoins(FREE_AD_CONFIG.dailyBonusCoins);
        document.getElementById('statusMsg').innerText =
          `🎉 અભિનંદન! તમને ${FREE_AD_CONFIG.dailyBonusCoins} Coins મળ્યા!`;
      });
    }

    function activate2XBoost() {
      showRewardedAdFlow(() => {
        boostUntil = Date.now() + FREE_AD_CONFIG.boostDurationMs;
        localStorage.setItem('aa_2x_until', boostUntil);
        updateCoinsUI();
        document.getElementById('statusMsg').innerText =
          '⚡ 15 મિનિટ માટે 2X Coins Boost ચાલુ થઈ ગયું!';
      });
    }

    /* ============================================================
       2. EIGHT GAMES LIST (OFFLINE PRACTICE SUPPORTED)
       ============================================================ */
    const GAMES = [
      { id: 'bottle',  name: 'Bottle Colour',  icon: '💧', tag: 'Revive / +1 Bottle Ad', file: 'bottle-colour.html' },
      { id: 'car',     name: 'Car Speed',      icon: '🏎️', tag: 'Revive / 2X Coins Ad',   file: 'car-speed.html' },
      { id: 'bike',    name: 'Bike Speed',     icon: '🏍️', tag: 'Revive / 2X Coins Ad',   file: 'bike-speed.html' },
      { id: 'ludo',    name: 'Ludo',           icon: '🎲', tag: 'Extra Roll Ad',          file: 'ludo.html' },
      { id: 'carrom',  name: 'Carrom',         icon: '🎱', tag: 'Bonus Strike Ad',        file: 'carrom.html' },
      { id: 'sarp',    name: 'Sarp Sidi',      icon: '🐍', tag: 'Extra Dice Ad',          file: 'sarp-sidi.html' },
      { id: 'arrow',   name: 'Arrow Puzzle',   icon: '🏹', tag: 'Hint / Extra Move Ad',   file: 'arrow-puzzle.html' },
      { id: 'khfruit', name: 'K.H Fruits',     icon: '🍊', tag: 'નટુ કાકા • Double Profit Ad', file: 'kh-fruits.html' }
    ];

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      GAMES.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => openGame(g);

        card.innerHTML = `
          <div class="game-icon">${g.icon}</div>
          <div class="game-name">${g.name}</div>
          <div class="game-tag">${g.tag}</div>
          <div class="play-pill">▶ રમો</div>
        `;
        grid.appendChild(card);
      });
    }

    function openGame(game) {
      // સામાન્ય રમત ઓફલાઇન પણ ચાલશે (કોઈ બ્લોક નહીં)
      document.getElementById('statusMsg').innerText =
        `🚀 ${game.name} ખોલી રહ્યા છીએ...`;

      // જો તમે અલગ HTML ફાઇલ બનાવો તો તે ખુલશે; ન હોય તો હાલની ફાઇલમાં પ્રિવ્યૂ મેસેજ બતાવશે
      fetch(game.file, { method: 'HEAD' })
        .then(res => {
          if (res.ok) {
            window.location.href = game.file;
          } else {
            document.getElementById('statusMsg').innerText =
              `ℹ️ ${game.name} (${game.file}) ની ફાઇલ GitHub માં ઉમેરતા જ સીધી ખુલશે.`;
          }
        })
        .catch(() => {
          document.getElementById('statusMsg').innerText =
            `ℹ️ ${game.name} (${game.file}) ની ફાઇલ GitHub માં ઉમેરતા જ સીધી ખુલશે.`;
        });
    }

    // Init
    updateNetworkUI();
    updateCoinsUI();
    renderGames();
  </script>
</body>
</html>
