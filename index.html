
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08132e">
<title>A&AGame - Bottle Colour</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:linear-gradient(140deg,#07152f,#271052);
 color:white;font-family:Arial;text-align:center;
 min-height:100vh;padding:15px;
}
h1{color:#ffcf40;font-size:29px}
button{
 border:0;border-radius:12px;padding:12px 18px;
 background:#633be9;color:white;font-size:16px;
 font-weight:bold;margin:5px;cursor:pointer;
}
button:active{transform:scale(.95)}
#menu,#game{max-width:650px;margin:auto}
.games{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.tile{
 background:#19376c;border:2px solid #668cff;
 border-radius:17px;padding:20px 5px;
 font-size:18px;cursor:pointer;
}
.tile span{font-size:38px;display:block;margin-bottom:8px}
#game{display:none}
.info{font-size:18px;margin:15px}
.board{
 display:flex;justify-content:center;align-items:flex-end;
 gap:13px;flex-wrap:wrap;margin:35px auto;
 min-height:180px;
}
.bottle{
 width:52px;height:145px;
 border:3px solid #dce8ff;
 border-top:0;border-radius:5px 5px 17px 17px;
 display:flex;flex-direction:column-reverse;
 padding:4px;gap:2px;
 cursor:pointer;background:#ffffff18;
 transition:.15s;
}
.bottle.selected{
 transform:translateY(-13px);
 border-color:#ffdc38;
}
.water{
 flex:1;width:100%;border-radius:3px;
}
#message{min-height:28px;color:#ffdb58;font-size:17px}
</style>
</head>

<body>

<div id="menu">
<h1>👑 A&AGame</h1>
<p>🎮 Play • Enjoy • Win</p>
<h2>Choose Your Game</h2>
<div class="games">
<div class="tile" onclick="startGame()">
<span>🧪</span>Bottle Colour
</div>
<div class="tile"><span>🏎️</span>Car Speed</div>
<div class="tile"><span>🏍️</span>Bike Speed</div>
<div class="tile"><span>🎲</span>Ludo</div>
<div class="tile"><span>🎯</span>Carrom</div>
<div class="tile"><span>⬆️</span>Arrow Puzzle</div>
<div class="tile"><span>🍎</span>K.H Fruits</div>
<div class="tile"><span>🧩</span>Puzzle Game</div>
</div>
</div>

<div id="game">
<h1>🧪 Bottle Colour</h1>
<div class="info">
Level: <span id="level">1</span>
</div>
<p>બોટલ પર ટચ કરીને પાણી ગોઠવો!</p>
<div class="board" id="board"></div>
<div id="message"></div>
<button onclick="restart()">↻ Restart</button>
<button onclick="nextLevel()">Next Level ➜</button>
<button onclick="back()">🏠 Home</button>
</div>

<script>
let level=1;
let bottles=[];
let selected=-1;
let history=[];

const colors=["#ff3939","#348cff","#ffdc35","#35d67a"];

function startGame(){
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
 level=1;
 newLevel();
}

function makeLevel(){
 let layers=[
  colors[0],colors[1],colors[0],colors[2],
  colors[2],colors[0],colors[1],colors[3],
  colors[1],colors[2],colors[3],colors[0],
  colors[3],colors[1],colors[2],colors[3]
 ];
 // Four colours, four units each.
 let shuffled=[];
 for(let i=0;i<4;i++){
  shuffled.push(layers.slice(i*4,i*4+4));
 }
 return shuffled;
}

function newLevel(){
 bottles=makeLevel();
 bottles.push([],[]);
 selected=-1;
 history=[];
 document.getElementById("level").textContent=level;
 document.getElementById("message").textContent="";
 render();
}

function render(){
 const board=document.getElementById("board");
 board.innerHTML="";
 bottles.forEach((b,i)=>{
  const el=document.createElement("div");
  el.className="bottle"+(selected===i?" selected":"");
  b.forEach(c=>{
   const water=document.createElement("div");
   water.className="water";
   water.style.background=c;
   el.appendChild(water);
  });
  el.onclick=()=>tap(i);
  board.appendChild(el);
 });
}

function tap(i){
 if(selected===-1){
  if(bottles[i].length===0)return;
  selected=i;
 }else if(selected===i){
  selected=-1;
 }else{
  pour(selected,i);
  selected=-1;
 }
 render();
}

function pour(a,b){
 let source=bottles[a],target=bottles[b];
 if(source.length===0)return;
 let color=source[source.length-1];
 if(target.length===4)return;
 if(target.length>0 && target[target.length-1]!==color)return;

 history.push(JSON.stringify(bottles));
 while(source.length>0 &&
       source[source.length-1]===color &&
       target.length<4){
  target.push(source.pop());
 }
 if(won()){
  document.getElementById("message").textContent=
  "🎉 શાબાશ! લેવલ પૂરું થયું!";
 }
}

function won(){
 return bottles.every(b=>
  b.length===0 ||
  (b.length===4 && b.every(c=>c===b[0]))
 );
}

function restart(){
 newLevel();
}

function nextLevel(){
 if(!won()){
  document.getElementById("message").textContent=
  "પહેલાં આ લેવલ પૂરું કરો!";
  return;
 }
 level++;
 newLevel();
}

function back(){
 document.getElementById("game").style.display="none";
 document.getElementById("menu").style.display="block";
}

newLevel();
</script>

</body>
</html>
