
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09152e">
<title>A&AGame - Bottle Colour</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:15px;
 background:radial-gradient(circle at top,#263b77,#10102e 65%,#080d20);
 color:white;font-family:Arial,sans-serif;text-align:center;
}
h1{color:#ffd34c;font-size:29px}
.info{font-size:19px;margin:12px}
#menu,#game{max-width:650px;margin:auto}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
 background:linear-gradient(145deg,#254c94,#151e51);
 border:2px solid #718dff;border-radius:17px;
 padding:20px 5px;font-size:18px;cursor:pointer;
}
.tile span{display:block;font-size:42px;margin-bottom:8px}
#game{display:none}
.board{
 display:flex;justify-content:center;align-items:flex-end;
 flex-wrap:wrap;gap:20px 16px;
 margin:40px auto;min-height:205px;
}
.bottle{
 width:58px;height:158px;
 border:3px solid #d8eaff;
 border-top:0;border-radius:5px 5px 19px 19px;
 background:linear-gradient(90deg,#ffffff22,#ffffff08,#ffffff30);
 padding:5px;display:flex;flex-direction:column-reverse;
 gap:2px;cursor:pointer;
 box-shadow:inset 3px 0 5px #ffffff30,0 7px 15px #0008;
 transition:transform .2s,border-color .2s;
 position:relative;
}
.bottle:before{
 content:"";position:absolute;
 width:24px;height:13px;
 border:3px solid #d8eaff;border-bottom:0;
 border-radius:7px 7px 0 0;
 top:-13px;left:50%;transform:translateX(-50%);
 background:#182b59;
}
.bottle.selected{
 transform:translateY(-18px);
 border-color:#ffdf48;
 box-shadow:0 0 18px #ffdb40;
}
.water{
 width:100%;flex:1;border-radius:4px;
 box-shadow:inset 3px 0 5px #ffffff55;
 animation:fill .25s ease;
}
@keyframes fill{
 from{opacity:.3;transform:scaleY(.5)}
 to{opacity:1;transform:scaleY(1)}
}
button{
 border:0;border-radius:12px;padding:13px 17px;
 background:linear-gradient(135deg,#7652ff,#3d54d8);
 color:white;font-size:16px;font-weight:bold;
 margin:5px;cursor:pointer;
}
button:active{transform:scale(.95)}
#message{
 min-height:35px;color:#ffdf51;
 font-size:19px;font-weight:bold;
}
#next{background:linear-gradient(135deg,#159d65,#087b4c)}
#back{background:#34445e}
</style>
</head>

<body>

<div id="menu">
<h1>👑 A&AGame</h1>
<p>🎮 Play • Enjoy • Win</p>
<h2>Choose Your Game</h2>
<div class="games">
<div class="tile" onclick="startGame()"><span>🧪</span>Bottle Colour</div>
<div class="tile"><span>🏎️</span>Car Speed</div>
<div class="tile"><span>🏍️</span>Bike Speed</div>
<div class="tile"><span>🎲</span>Ludo</div>
<div class="tile"><span>🎯</span>Carrom</div>
<div class="tile"><span>⬆️</span>Arrow Puzzle</div>
<div class="tile"><span>🍎</span>K.H Fruits</div>
<div class="tile"><span>🧩</span>Puzzle Game</div>
</div>
</div>

<div id="game">
<h1>🧪 Bottle Colour</h1>
<div class="info">Level: <span id="level">1</span></div>
<p>બોટલ પર ટચ કરીને પાણી ગોઠવો!</p>
<div class="board" id="board"></div>
<div id="message"></div>
<button onclick="restart()">↻ Restart</button>
<button id="next" onclick="nextLevel()">Next Level ➜</button>
<button id="back" onclick="back()">🏠 Home</button>
</div>

<script>
const COLORS=[
 "#ff3939","#348cff","#ffdc35","#35d67a",
 "#b64dff","#ff8a32"
];

let level=1;
let bottles=[];
let selected=-1;
let finished=false;
let startLayout=[];

function startGame(){
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
 level=1;
 newLevel();
}

function createPuzzle(){
 let count=Math.min(4+Math.floor((level-1)/2),6);
 let pieces=[];

 for(let i=0;i<count;i++){
  for(let j=0;j<4;j++)pieces.push(COLORS[i]);
 }

 // Shuffle colours to create a puzzle.
 for(let i=pieces.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [pieces[i],pieces[j]]=[pieces[j],pieces[i]];
 }

 let result=[];
 for(let i=0;i<count;i++){
  result.push(pieces.slice(i*4,i*4+4));
 }
 result.push([],[]);
 return result;
}

function newLevel(){
 bottles=createPuzzle();
 startLayout=JSON.stringify(bottles);
 selected=-1;
 finished=false;
 document.getElementById("level").textContent=level;
 document.getElementById("message").textContent="";
 document.getElementById("next").disabled=true;
 render();
}

function render(){
 const board=document.getElementById("board");
 board.innerHTML="";

 bottles.forEach((b,i)=>{
  const el=document.createElement("div");
  el.className="bottle"+(selected===i?" selected":"");

  b.forEach(color=>{
   const water=document.createElement("div");
   water.className="water";
   water.style.background=color;
   el.appendChild(water);
  });

  el.onclick=()=>tap(i);
  board.appendChild(el);
 });
}

function tap(i){
 if(finished)return;

 if(selected===-1){
  if(bottles[i].length===0)return;
  selected=i;
 }else if(selected===i){
  selected=-1;
 }else{
  pour(selected,i);
  selected=-1;
 }
 render();
}

function pour(a,b){
 let src=bottles[a];
 let dst=bottles[b];

 if(src.length===0 || dst.length>=4)return;

 let color=src[src.length-1];

 if(dst.length>0 && dst[dst.length-1]!==color){
  document.getElementById("message").textContent=
  "❌ આ રંગ અહીં જઈ શકતો નથી!";
  return;
 }

 let moved=0;
 while(src.length>0 &&
       src[src.length-1]===color &&
       dst.length<4){
  dst.push(src.pop());
  moved++;
 }

 if(moved>0){
  document.getElementById("message").textContent="";
  checkWin();
 }
}

function checkWin(){
 const won=bottles.every(b=>
  b.length===0 ||
  (b.length===4 && b.every(c=>c===b[0]))
 );

 if(won){
  finished=true;
  document.getElementById("message").textContent=
  "🎉 શાબાશ! લેવલ પૂર્ણ થયું!";
  document.getElementById("next").disabled=false;
 }
}

function restart(){
 bottles=JSON.parse(startLayout);
 selected=-1;
 finished=false;
 document.getElementById("message").textContent="";
 document.getElementById("next").disabled=true;
 render();
}

function nextLevel(){
 if(!finished)return;
 level++;
 newLevel();
}

function back(){
 document.getElementById("game").style.display="none";
 document.getElementById("menu").style.display="block";
}
</script>

</body>
</html>
