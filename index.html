
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071735">
<title>A&AGame</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:linear-gradient(135deg,#071735,#24105c);
 color:white;
 font-family:Arial,sans-serif;
 padding:15px;
}
header{
 text-align:center;
 padding:15px 5px 22px;
}
header h1{
 font-size:38px;
 margin:5px;
 color:#ffce36;
 text-shadow:0 3px 8px #000;
}
header p{color:#cbdcff;margin:8px}
.banner{
 background:linear-gradient(90deg,#762bdf,#075bdc);
 padding:14px;
 border-radius:18px;
 text-align:center;
 font-size:19px;
 font-weight:bold;
 margin-bottom:18px;
}
.welcome{
 text-align:center;
 font-size:19px;
 margin:15px 0;
}
.games{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;
 max-width:850px;
 margin:auto;
}
.game{
 border:2px solid #6e8cff;
 border-radius:18px;
 background:linear-gradient(145deg,#173e83,#101b48);
 padding:17px 5px;
 text-align:center;
 min-height:145px;
 box-shadow:0 5px 12px #0007;
 cursor:pointer;
}
.game:active{transform:scale(.96)}
.game .emoji{font-size:48px}
.game h3{font-size:17px;margin:10px 0 0}
.footer{
 text-align:center;
 margin:25px 0 10px;
 color:#b8c8ff;
 font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>👑 A&A Game</h1>
<p>Play • Enjoy • Win</p>
</header>

<div class="banner">
🎮 8 Amazing Games in One App!
</div>

<div class="welcome">
🦁 Welcome to A&AGame
</div>

<div class="games">

<div class="game" onclick="openGame('Car Speed')">
<div class="emoji">🏎️</div>
<h3>Car Speed</h3>
</div>

<div class="game" onclick="openGame('Bike Speed')">
<div class="emoji">🏍️</div>
<h3>Bike Speed</h3>
</div>

<div class="game" onclick="openGame('Ludo')">
<div class="emoji">🎲</div>
<h3>Ludo</h3>
</div>

<div class="game" onclick="openGame('Carrom')">
<div class="emoji">🎯</div>
<h3>Carrom</h3>
</div>

<div class="game" onclick="openGame('Bottle Colour')">
<div class="emoji">🧪</div>
<h3>Bottle Colour</h3>
</div>

<div class="game" onclick="openGame('Arrow Puzzle')">
<div class="emoji">⬆️</div>
<h3>Arrow Puzzle</h3>
</div>

<div class="game" onclick="openGame('K.H Fruits Business')">
<div class="emoji">🍎</div>
<h3>K.H Fruits Business</h3>
</div>

<div class="game" onclick="openGame('Puzzle Game')">
<div class="emoji">🧩</div>
<h3>Puzzle Game</h3>
</div>

</div>

<div class="footer">
⭐ A&AGame | Free to Play<br>
Made with ❤️
</div>

<script>
function openGame(name){
 alert(name + " - Coming Soon!");
}
</script>

</body>
</html>
